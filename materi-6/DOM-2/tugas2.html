<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tantangan DOM: Notes App</title>
    <style>
        .completed {
            text-decoration: line-through;
            color: gray;
        }
        li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <h2>Aplikasi Catatan Kecil</h2>
    <input type="text" id="noteInput" placeholder="Tulis catatan baru...">
    <button id="addNoteBtn">Tambah Catatan</button>

    <ul id="noteList"></ul>

    <script>
        const noteInput = document.getElementById('noteInput');
        const button = document.getElementById('addNoteBtn');
        const list = document.getElementById('noteList');

        // 1. Array sekarang menampung objek (teks dan status selesai)
        let catatans = JSON.parse(localStorage.getItem('daftarCatatan')) || [];

        function tampilkanCatatan() {
            list.innerHTML = '';

            catatans.forEach(function(itemCatatan, index){
                const li = document.createElement('li');
                li.textContent = itemCatatan.teks;

                // Jika status di data aslinya true, langsung berikan class 'completed'
                if (itemCatatan.selesai) {
                    li.classList.add('completed');
                }

                // Fitur Coret: Klik <li> untuk mengubah status selesai (true/false)
                li.addEventListener('click', function(){
                    // Ubah status kebalikannya (kalau false jadi true, kalau true jadi false)
                    itemCatatan.selesai = !itemCatatan.selesai;
                    
                    // Simpan perubahan status ke LocalStorage dan refresh layar
                    simpanDanRefresh();
                });

                // Tombol Hapus
                const deleteNote = document.createElement('button');
                deleteNote.textContent = 'hapus'; 
                deleteNote.style.margin = '5px';
                
                deleteNote.addEventListener('click', function(e){
                    e.stopPropagation();
                    catatans.splice(index, 1);
                    simpanDanRefresh();
                });
            
                li.appendChild(deleteNote);
                list.appendChild(li);
            });
        }

        // Fungsi bantuan untuk simpan dan refresh
        function simpanDanRefresh() {
            localStorage.setItem('daftarCatatan', JSON.stringify(catatans));
            tampilkanCatatan();
        }

        // 2. Tombol Tambah Catatan Baru
        button.addEventListener('click', function() {
            const noteText = noteInput.value.trim();

            if (noteText === '') {
                alert('Catatan tidak boleh kosong!');
                return;
            }

            // Masukkan data baru sebagai objek lengkap dengan status selesai: false
            catatans.push({
                teks: noteText,
                selesai: false
            });

            simpanDanRefresh();
            noteInput.value = '';
        });

        // Jalankan saat pertama kali halaman dibuka
        tampilkanCatatan();
    </script>
</body>
</html>
