    <!-- dom + async await  -->

    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>proyek</title>
    </head>
    <body>
        <h2>Proyek getPhotoProfile</h2>
        <input type="text" id="inputName" placeholder="Masukkan username...">
        <button id="searchBtn">cari</button>

        <button id="btn">show all</button>
        
        <div id="container"></div>

        <script>
            const button = document.getElementById('btn')
            const container = document.getElementById('container')
            const inputName = document.getElementById('inputName')
            const searchBtn = document.getElementById('searchBtn')

            let userProfile = []

            function tampilkanPengguna(dataPengguna) {
                container.innerHTML = ''

                if(!Array.isArray(dataPengguna)) {
                    console.log('data pengguna error:', dataPengguna)
                    return
                }

                dataPengguna.forEach(function(user){
                    const card = document.createElement('div')
                    card.classList.add('user-card')

                    const nama = document.createElement('h3')
                    nama.textContent = `Username: ${user.name.first} ${user.name.last}`

                    const email = document.createElement('p')
                    email.textContent = `Email: ${user.email}`

                    const foto = document.createElement('img')
                    foto.src = user.picture.large
                    foto.alt = 'Foto Profile Pengguna'

                    card.appendChild(nama)
                    card.appendChild(email)
                    card.appendChild(foto)

                    container.appendChild(card)
                })
            }

            button.addEventListener('click', async function() {
                container.innerHTML = `<p>Memuat data...</p>`
                button.disabled = true

                try{
                    const response = await fetch('https://randomuser.me/api/?results=3')

                    if (!response.ok){
                        throw new Error('Gagal memuat API')
                    }

                    const data = await response.json()
                    userProfile = data.results
                    tampilkanPengguna(userProfile)
                } catch (err) {
                    container.textContent = `terjadi kesalah ${err.message}`
                }finally{
                    button.disabled = false
                }
            })

            searchBtn.addEventListener('click',function() {
                container.innerHTML = `<p>Memuat Data...</p>`
                searchBtn.disabled = true

                try{
                    const keyword = inputName.value.trim().toLowerCase()

                    if (userProfile.length === 0 ) {
                        container.innerHTML = `Click 'show all' terlebih dahulu`
                        return
                    }

                    if (keyword === ''){
                        tampilkanPengguna(userProfile)
                        return
                    }
                    
                    const hasilPencarian = userProfile.filter(function(user){
                        const namaDepan = user.name.first.toLowerCase()
                        const namaBelakang = user.name.last.toLowerCase()

                        return namaDepan.includes(keyword) || namaBelakang.includes(keyword)
                    })

                    if (hasilPencarian.length === 0) {
                        container.innerHTML = '<p>Pengguna tidak ditemukan!</p>'
                        return
                    }

                    tampilkanPengguna(hasilPencarian)
                }catch (err) {
                    container.innerHTML = `<p>Terjadi error ${err.message}`
                }finally{
                    searchBtn.disabled = false
                }
            })
        </script>
    </body>
    </html>
