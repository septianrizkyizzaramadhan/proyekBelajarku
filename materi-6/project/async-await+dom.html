
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Fetch API ke DOM</title>

    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        .user-card {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #f9f9f9;
        }

        input {
            padding: 8px;
            margin: 5px 0;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Daftar Pengguna dari API</h2>

    <button id="loadBtn">Ambil Data Pengguna</button>

    <br><br>

    <input
        type="text"
        id="search"
        placeholder="Cari nama pengguna..."
    >

    <button id="searchBtn">Cari</button>
    <button id="resetBtn">Tampilkan Semua</button>

    <div id="container" style="margin-top: 20px;"></div>

    <script>
        const loadBtn = document.getElementById('loadBtn');
        const container = document.getElementById('container');
        const inputName = document.getElementById('search');
        const searchBtn = document.getElementById('searchBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Menyimpan data pengguna dari API
        let users = [];

        // Fungsi untuk menampilkan data pengguna
        function tampilkanPengguna(dataPengguna) {
            container.innerHTML = '';

            if (dataPengguna.length === 0) {
                container.innerHTML =
                    '<p>Nama pengguna tidak ditemukan.</p>';
                return;
            }

            dataPengguna.forEach(function(user) {
                const card = document.createElement('div');
                card.classList.add('user-card');

                const nama = document.createElement('h3');
                nama.textContent = user.name;

                const username = document.createElement('p');
                username.textContent = `Username: ${user.username}`;

                const email = document.createElement('p');
                email.textContent = `Email: ${user.email}`;

                const kota = document.createElement('p');
                kota.textContent = `Kota: ${user.address.city}`;

                card.appendChild(nama);
                card.appendChild(username);
                card.appendChild(email);
                card.appendChild(kota);

                container.appendChild(card);
            });
        }

        // Mengambil data pengguna dari API
        loadBtn.addEventListener('click', async function() {
            container.innerHTML = '<p>Sedang memuat data...</p>';
            loadBtn.disabled = true;

            try {
                const response = await fetch(
                    'https://jsonplaceholder.typicode.com/users'
                );

                if (!response.ok) {
                    throw new Error(
                        'Gagal mengambil data dari server!'
                    );
                }

                users = await response.json();

                // Tampilkan semua pengguna
                tampilkanPengguna(users);

            } catch (error) {
                container.textContent =
                    `Terjadi error: ${error.message}`;
            } finally {
                loadBtn.disabled = false;
            }
        });

        // Fitur pencarian nama
        searchBtn.addEventListener('click', function() {
            const keyword = inputName.value
                .trim()
                .toLowerCase();

            if (users.length === 0) {
                container.innerHTML =
                    '<p>Ambil data pengguna terlebih dahulu!</p>';
                return;
            }

            if (keyword === '') {
                tampilkanPengguna(users);
                return;
            }

            const hasilPencarian = users.filter(function(user) {
                return user.name
                    .toLowerCase()
                    .includes(keyword);
            });

            tampilkanPengguna(hasilPencarian);
        });

        // Bisa mencari dengan menekan Enter
        inputName.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                searchBtn.click();
            }
        });

        // Menampilkan kembali seluruh pengguna
        resetBtn.addEventListener('click', function() {
            inputName.value = '';

            if (users.length === 0) {
                container.innerHTML =
                    '<p>Ambil data pengguna terlebih dahulu!</p>';
                return;
            }

            tampilkanPengguna(users);
        });
    </script>
</body>
</html>
